name: WebExtension CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deps:
    name: Install, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Restore Yarn & node_modules cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/yarn
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Build chromium
        run: yarn build:chromium

      - name: Build firefox
        run: yarn build:firefox

      - name: Upload chromium build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: dist-chromium
          path: dist/chromium
          retention-days: 1

      - name: Upload firefox build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: dist-firefox
          path: dist/firefox
          retention-days: 1

  build_chromium:
    name: Pack (chromium)
    needs: deps
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download chromium build
        uses: actions/download-artifact@v8
        with:
          name: dist-chromium
          path: dist/chromium

      - name: Zip chromium
        working-directory: dist/chromium
        run: zip -r ../surround-it-chromium.zip .

      - name: Upload chromium ZIP
        uses: actions/upload-artifact@v7
        with:
          name: surround-it-chromium
          path: dist/surround-it-chromium.zip

  build_firefox:
    name: Pack (firefox)
    needs: deps
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download firefox build
        uses: actions/download-artifact@v8
        with:
          name: dist-firefox
          path: dist/firefox

      - name: Zip firefox
        working-directory: dist/firefox
        run: zip -r ../surround-it-firefox.zip .

      - name: Upload firefox ZIP
        uses: actions/upload-artifact@v7
        with:
          name: surround-it-firefox
          path: dist/surround-it-firefox.zip

  release:
    name: GitHub Release ${{ github.ref_name }}
    needs: [ build_chromium, build_firefox ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both ZIPs
        uses: actions/download-artifact@v8
        with:
          pattern: surround-it-*
          merge-multiple: true
          path: dist

      - name: Create Release and attach ZIPs
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/surround-it-*.zip
